name: Deploy Prepwise

on:
  push:
    branches:
      - main   # Deploy automatically on every push to main

jobs:
  # ─── Run backend unit tests before deploying ────────────────────────────────
  test-backend:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Unit tests only (no live MongoDB or AI service needed)
      - name: Run unit tests
        run: |
          npm run test:auth:unit
          npm run test:wiring
          npm run test:profile-skills
          npm run test:interviews
          npm run test:patterns
          npm run test:readiness
          npm run test:readiness:wiring
          npm run test:progress
          npm run test:progress:wiring

  # ─── Run AI service tests ────────────────────────────────────────────────────
  test-ai-service:
    name: AI Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pattern detector tests
        run: python tests/test_pattern_detector.py

  # ─── Deploy frontend to Vercel ───────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    needs: [test-backend, test-ai-service]  # Only deploy if tests pass
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        run: |
          vercel --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # The backend URL that the built frontend will call
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

  # ─── Trigger Render deploy (backend + AI service) ───────────────────────────
  deploy-render:
    name: Deploy Backend + AI Service (Render)
    needs: [test-backend, test-ai-service]  # Only deploy if tests pass
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook — Backend
        run: curl -s "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}"

      - name: Trigger Render deploy hook — AI Service
        run: curl -s "${{ secrets.RENDER_DEPLOY_HOOK_AI_SERVICE }}"
